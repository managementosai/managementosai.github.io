<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Golos+Text:wght@400;600&display=swap">
<style>
:root{--bg:#0c1528;--fg:#f3f5fa;--muted:#b5c0d6;--accent:#ff8a3d;--mint:#4fe3c1;--on:#141016;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Golos Text",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px));
background-image:radial-gradient(60vmax 45vmax at 105% -10%,rgba(255,138,61,.2),transparent 60%),radial-gradient(55vmax 45vmax at -15% 110%,rgba(79,227,193,.14),transparent 60%)}
main{display:grid;gap:24px;justify-items:center;text-align:center;max-width:520px}
b{font-family:"Unbounded",sans-serif;font-size:96px;line-height:1;background:linear-gradient(90deg,var(--accent),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:0;font-size:24px}
p{margin:0;color:var(--muted)}
a{display:inline-block;background:linear-gradient(90deg,var(--accent),#ffa25c);color:var(--on);font-weight:600;text-decoration:none;border-radius:999px;padding:14px 26px}
a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
</style>
</head>
<body>
<main>
  <b>404</b>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Всё главное — на основной странице.</p>
  <a href="./">На главную</a>
</main>
</body>
</html>
